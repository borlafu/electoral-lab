[project]
name = "electoral-lab"
version = "0.1.0"
description = "Laboratorio electoral local: sondeos, incertidumbre, reparto legal y probabilidad de voto decisivo (E_pc) para el Congreso."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14",
  "pyyaml>=6",
  "pydantic>=2.5",
  "typer>=0.12",
  "httpx>=0.27",
  "pdfplumber>=0.11",
  "streamlit>=1.36",
  "altair>=5",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]

[project.scripts]
electoral = "electoral_lab.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/electoral_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B008", "E702", "E501"]  # B008: patrón habitual de Typer; E501: lo cubre el formateador
