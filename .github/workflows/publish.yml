# Recalcula el análisis completo (52 circunscripciones) y publica en main la instantánea ligera que carga la
# app de Streamlit Cloud. Streamlit redespliega la app al detectar el commit.
#
# El commit no se hace con git push sino con la API GraphQL de GitHub (createCommitOnBranch): así lo firma
# GitHub y sale como Verified, que es lo que exige la regla de commits firmados de main.
#
# La regla de Code Scanning del ruleset espera resultados de CodeQL para un commit que aún no existe, así que
# ningún commit directo puede cumplirla, y en un repositorio personal no se puede añadir GitHub Actions a la
# lista de bypass. Por eso el commit se crea con el secreto PUBLISH_TOKEN: un token fine-grained del dueño del
# repo (admin, que sí está en el bypass), limitado a este repositorio y con Contents en lectura y escritura.
# Sin ese secreto se usa el GITHUB_TOKEN y el ruleset rechazará el commit.
#
# Calendario legal: el art. 69.7 LOREG prohíbe publicar, difundir o reproducir sondeos durante los cinco días
# anteriores a la votación (del 24 al 28 de noviembre para el 29-N). El flujo no publica nada después de
# PUBLISH_UNTIL (hora de Madrid), ni siquiera si se lanza a mano.
name: Publicar análisis completo

on:
  schedule:
    - cron: "30 5 * * *"   # 06:30 en Madrid (UTC+1)
  workflow_dispatch:
    inputs:
      sims:
        description: Número de simulaciones
        default: "20000"
        required: false
      force:
        description: Recalcular aunque no haya sondeos nuevos (p. ej. tras cambiar el modelo)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

env:
  PUBLISH_UNTIL: "2026-11-23"
  ELECTORAL_LAB_CONTACT: ${{ vars.ELECTORAL_LAB_CONTACT || 'github-actions@users.noreply.github.com' }}
  UV_PYTHON: "3.12"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Comprobar el calendario legal (art. 69.7 LOREG)
        id: gate
        run: |
          today=$(TZ=Europe/Madrid date +%F)
          if [[ "$today" > "$PUBLISH_UNTIL" ]]; then
            echo "::notice::Hoy es $today, posterior a PUBLISH_UNTIL=$PUBLISH_UNTIL: no se publica (art. 69.7 LOREG)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.publish == 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.publish == 'true'
        with:
          enable-cache: true

      - name: Instalar dependencias
        if: steps.gate.outputs.publish == 'true'
        run: uv sync --frozen

      - name: Actualizar sondeos
        id: polls
        if: steps.gate.outputs.publish == 'true'
        run: |
          uv run electoral sources refresh --only polls --strict
          uv run electoral data seed
          if git diff --quiet -- data/seed && [[ -f data/published/latest/manifest.json ]] \
             && [[ "${{ inputs.force }}" != "true" ]]; then
            echo "::notice::No hay sondeos nuevos desde la última publicación."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validar datos
        if: steps.polls.outputs.changed == 'true'
        run: uv run electoral data validate

      - name: Análisis completo (52 circunscripciones)
        if: steps.polls.outputs.changed == 'true'
        run: uv run electoral run --all --sims "${{ inputs.sims || '20000' }}"

      - name: Exportar instantánea
        if: steps.polls.outputs.changed == 'true'
        run: uv run electoral publish

      - name: Commit firmado en main (API de GitHub)
        if: steps.polls.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
          HAS_PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN != '' }}
        run: |
          git add -A data/published data/seed
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          if [[ "$HAS_PUBLISH_TOKEN" != "true" ]]; then
            echo "::warning::Falta el secreto PUBLISH_TOKEN: el ruleset de main probablemente rechazará el commit."
          fi
          msg=$(jq -r '"Análisis publicado: \(.run_id) (último sondeo \(.last_poll), \(.n_polls) sondeos)"' data/published/latest/PUBLISHED.json)
          # Ficheros añadidos/modificados (contenido en base64) y borrados, respecto al commit de partida.
          # expectedHeadOid hace que falle sin pisar nada si main ha cambiado durante la ejecución.
          git diff --cached --name-status --no-renames > "$RUNNER_TEMP/changes.txt"
          MSG="$msg" HEAD_OID="$(git rev-parse HEAD)" python3 - > "$RUNNER_TEMP/commit.json" <<'PY'
          import base64, json, os, pathlib
          adds, dels = [], []
          for line in open(os.path.join(os.environ["RUNNER_TEMP"], "changes.txt"), encoding="utf-8"):
              status, path = line.rstrip("\n").split("\t", 1)
              if status == "D":
                  dels.append({"path": path})
              else:
                  adds.append({"path": path, "contents": base64.b64encode(pathlib.Path(path).read_bytes()).decode()})
          query = ("mutation($input: CreateCommitOnBranchInput!) "
                   "{ createCommitOnBranch(input: $input) { commit { oid url } } }")
          print(json.dumps({"query": query, "variables": {"input": {
              "branch": {"repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"], "branchName": "main"},
              "expectedHeadOid": os.environ["HEAD_OID"],
              "message": {"headline": os.environ["MSG"]},
              "fileChanges": {"additions": adds, "deletions": dels},
          }}}))
          PY
          echo "Cambios: $(wc -l < "$RUNNER_TEMP/changes.txt") ficheros, $(du -h "$RUNNER_TEMP/commit.json" | cut -f1) de carga"
          url=$(gh api graphql --input "$RUNNER_TEMP/commit.json" --jq '.data.createCommitOnBranch.commit.url')
          echo "Commit: $url"
          {
            echo "### Análisis publicado"
            jq -r '"- Ejecución: `\(.run_id)`\n- Último sondeo: \(.last_poll) (\(.n_polls) sondeos)\n- Simulaciones: \(.n_sims)\n- Tamaño: \(.size_bytes / 1e6 | floor) MB"' data/published/latest/PUBLISHED.json
            echo "- Commit: $url"
          } >> "$GITHUB_STEP_SUMMARY"
